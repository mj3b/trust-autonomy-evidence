name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate research artifacts
        run: python scripts/validate_repository.py
      - name: Validate paper workspace
        run: python scripts/validate_paper.py
      - name: Check release manifest regeneration
        run: python scripts/build_release_manifest.py && git diff --exit-code -- release/v0.5.0-manifest.json
